import groovy.json.JsonSlurper
import groovy.json.JsonOutput

apply plugin: 'com.android.application'

android {
    namespace = "com.ieble.wms.test"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.ieble.wms.test"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        liveReload {
            initWith debug
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Only this debug variant sees server.url. cap sync keeps main assets bundled/offline.
def liveReloadAssets = layout.buildDirectory.dir('generated/liveReloadAssets')
android.sourceSets.liveReload {
    manifest.srcFile 'src/debug/AndroidManifest.xml'
    res.srcDirs += 'src/debug/res'
    assets.srcDir liveReloadAssets
}
tasks.register('generateLiveReloadConfig') {
    inputs.file('src/main/assets/capacitor.config.json')
    outputs.dir(liveReloadAssets)
    doLast {
        def config = new JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
        config.server = (config.server ?: [:]) + [url: 'http://localhost:5174', cleartext: true]
        config.android.webContentsDebuggingEnabled = true
        // Browser fetch through Vite's /api proxy preserves same-origin cookies and CSRF.
        config.plugins.CapacitorHttp.enabled = false
        def target = new File(liveReloadAssets.get().asFile, 'capacitor.config.json')
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(config))
    }
}
tasks.register('verifyBundledServerConfig') {
    doLast {
        def config = new JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
        if (config.server?.url) throw new GradleException('Bundled APK must not contain server.url. Run npm run android:sync.')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preLiveReloadBuild') task.dependsOn 'generateLiveReloadConfig'
    if (task.name in ['preDebugBuild', 'preReleaseBuild']) task.dependsOn 'verifyBundledServerConfig'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
